name: Django CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set environment variables
        run: echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log In In Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build --build-arg SECRET_KEY="${{ secrets.SECRET_KEY }}" -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

      - name: Build Docker image for nginx
        run: docker build -f nginx/Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/mynginx:${{ github.sha }} ./nginx

      - name: Push Docker image for nginx
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mynginx:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY  }}

      - name: Deploy to Server
        run: |
          ssh -v -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
          # Экспортируем переменные (они станут доступны как $VAR_NAME)
          export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          export GITHUB_SHA=${{ github.sha }}
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          export POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          export TELEGRAM_URL=${{ secrets.TELEGRAM_URL }}
          export BOT_TELEGRAM_TOKEN=${{ secrets.BOT_TELEGRAM_TOKEN }}
          
          # Отладка: выводим переменные для проверки (уберите после тестов)
          echo "DOCKER_HUB_USERNAME: $DOCKER_HUB_USERNAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          
          # Пуллим образы (теперь с корректными переменными)
          docker pull $DOCKER_HUB_USERNAME/myapp:$GITHUB_SHA
          docker pull $DOCKER_HUB_USERNAME/mynginx:$GITHUB_SHA
          
          # Обновляем репозиторий
          if [ -d CourseProject5 ]; then 
            cd CourseProject5 && git pull origin feature/docker
          else
            git clone git@github.com:Streiker-Saik/CourseProject5.git
            cd CourseProject5
            git checkout feature/docker
          fi
          
          # Обновляем docker-compose.yml (теперь с корректными переменными)
          sed -i "s|build: .|image: $DOCKER_HUB_USERNAME/myapp:$GITHUB_SHA|g" docker-compose.yml
          
          # Проверяем конфигурацию (для отладки)
          docker-compose config
          
          docker-compose down -v || true
          docker compose up -d --remove-orphans
          EOF
